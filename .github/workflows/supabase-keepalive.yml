name: Supabase keep-alive

# Runs daily rather than weekly on purpose: GitHub occasionally delays or
# drops a scheduled run under load, and Supabase pauses a project after 7
# days with no activity. Daily leaves a full week of margin even if a
# single run gets skipped. There's also an independent external ping
# (cron-job.org) hitting the same endpoint, so this doesn't depend on
# GitHub Actions' scheduler alone - see README.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase (read-only, writes nothing)
        run: |
          set -euo pipefail
          URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d '=' -f2- | tr -d '"')
          KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d '=' -f2- | tr -d '"')
          curl --fail --silent --show-error \
            "${URL}/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            -o /dev/null
